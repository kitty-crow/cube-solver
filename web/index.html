<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="Browser picture-cube solver.">
  <meta name="theme-color" content="#eef3f1">
  <title>Picture Cube Solver</title>
  <!-- pages:head -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./scan-guide.css">
</head>
<body class="pages-body app-body">
  <a class="pages-skip" href="#content">Skip to content</a>
  <header class="pages-header" data-pages-header>
    <div class="pages-header__inner">
      <a class="pages-brand" href="./">Picture Cube Solver</a>
      <nav class="pages-nav" aria-label="Primary navigation">
        <a href="#scanner">Scan</a>
        <a href="https://github.com/kitty-crow/cube-solver">GitHub</a>
      </nav>
      <button class="pages-theme" type="button" data-theme-toggle aria-pressed="false">
        <span class="pages-theme__track" aria-hidden="true"><span class="pages-theme__thumb"></span></span>
        <span data-theme-label aria-hidden="true">☀️</span>
      </button>
    </div>
  </header>

  <main id="content" class="pages-main app-main">
    <section class="tool-head">
      <h1>Picture Cube Solver</h1>
      <label class="cube-size-picker" for="cube-size">
        <span>Cube</span>
        <select id="cube-size">
          <option value="2">2×2×2</option>
          <option value="3" selected>3×3×3</option>
          <option value="4">4×4×4</option>
        </select>
      </label>
    </section>

    <section id="scanner" class="scanner-layout" aria-labelledby="scan-title">
      <div class="camera-panel pages-panel">
        <div class="camera-stage">
          <video id="camera" playsinline muted></video>
          <div id="face-guide" class="face-guide" aria-hidden="true"></div>
          <div class="camera-empty"><strong>Camera off</strong></div>
          <div id="stability-label" class="stability-badge">Start camera</div>
        </div>
        <canvas id="capture-canvas" hidden></canvas>
        <canvas id="probe-canvas" hidden></canvas>
        <div class="camera-actions">
          <button id="start-camera" class="pages-button pages-button--primary" type="button">Start camera</button>
          <button id="capture-face" class="pages-button pages-button--primary" type="button" disabled>Capture face</button>
          <label class="auto-toggle">
            <input id="auto-capture" type="checkbox" checked>
            <span>Auto-capture</span>
          </label>
        </div>
      </div>

      <aside class="scan-step pages-panel">
        <div class="scan-step__top">
          <span id="scan-counter" class="scan-counter">1 / 6</span>
          <span id="worker-status" class="runtime-status">Loading Python…</span>
        </div>
        <h2 id="scan-title">Scan front</h2>
        <p id="scan-instruction">Choose a front face and keep the cube upright.</p>
        <div class="scan-guide-wrap">
          <p class="scan-guide-help">Not sure? Follow the animation below.</p>
          <div id="scan-orientation-guide" class="scan-orientation-guide" aria-label="Animated 3D guide showing how to orient the cube for the next scan"></div>
        </div>
        <div class="scan-progress" aria-hidden="true"><span id="scan-progress"></span></div>
        <button id="solve-cube" class="pages-button pages-button--primary solve-button" type="button" disabled>Loading Python…</button>
      </aside>
    </section>

    <section class="review-section" aria-labelledby="review-title">
      <div class="section-heading"><h2 id="review-title">Captured faces</h2></div>
      <div id="review-grid" class="review-grid"><p class="review-empty">No captures yet.</p></div>
    </section>

    <section id="result-panel" class="result-section pages-panel" hidden aria-labelledby="result-title">
      <div class="result-head">
        <div><h2 id="result-title">Solution</h2><p id="result-summary"></p></div>
        <p id="confidence-text" class="confidence-text"></p>
      </div>
      <div class="result-grid">
        <div id="cube-view" class="cube-view" aria-label="Interactive 3D model of the scanned cube"></div>
        <div class="move-panel">
          <div id="move-text" class="move-token">Ready</div>
          <p id="move-detail"></p>
          <div class="move-buttons">
            <button id="prev-move" class="pages-button" type="button" disabled>Previous</button>
            <button id="play-moves" class="pages-button pages-button--primary" type="button">Play</button>
            <button id="next-move" class="pages-button" type="button">Next</button>
          </div>
          <button id="reset-playback" class="pages-button pages-button--quiet" type="button" disabled>Reset</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="pages-footer">
    <span data-version>v…</span>
    <span><a href="https://github.com/kitty-crow/cube-solver">Source</a></span>
  </footer>
  <!-- pages:body -->
  <script type="module" src="./app.js"></script>
  <script type="module" src="./scan-guide.js"></script>
</body>
</html>
