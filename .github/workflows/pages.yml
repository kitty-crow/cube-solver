name: Check and deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install project
        run: bun install
      - name: Install vendored Pages template
        run: bun install --cwd vendor/pages
      - name: Collect strict TypeScript diagnostics
        id: typecheck
        shell: bash
        run: |
          set +e
          bun run typecheck 2>&1 | tee /tmp/typecheck.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload strict TypeScript diagnostics
        if: steps.typecheck.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: strict-typescript-diagnostics
          path: /tmp/typecheck.log
      - name: Fail strict TypeScript check
        if: steps.typecheck.outputs.status != '0'
        run: exit 1
      - name: Check application
        run: bun run check
      - name: Build Pages site from TypeScript
        run: bun run build
      - name: Install mobile audit browser
        run: |
          cd vendor/pages
          bunx playwright install --with-deps chromium
      - name: Audit mobile responsiveness
        run: bun run audit:mobile
      - name: Set up Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
